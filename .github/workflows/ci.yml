name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Na main nie przerywamy: anulowanie w trakcie deployu zostawiłoby VPS w połowie.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shoplist
          POSTGRES_PASSWORD: shoplist
          POSTGRES_DB: shoplist_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shoplist"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://shoplist:shoplist@localhost:5432/shoplist_test
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migracje zgodne z modelami
        run: |
          alembic upgrade head
          alembic check
      - name: Testy
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # wersję bierze z "packageManager" w package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test
      # Build aplikacji i Storybooka sprawdza też job images (w Dockerze),
      # ale tutaj błąd wychodzi szybciej i z czytelnym logiem.
      - run: pnpm --filter @shoplist/web build
      - run: pnpm --filter @shoplist/web build-storybook --quiet

  images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: shoplist-backend
            context: backend
            file: backend/Dockerfile
          - name: shoplist-web
            context: .
            file: apps/web/Dockerfile
    env:
      # PR-y tylko budują obrazy. Push do GHCR wyłącznie z main.
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - name: Nazwa obrazu (GHCR wymaga małych liter)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ env.PUSH == 'true' }}
          # Tag = pełny SHA commita. Deploy i rollback wskazują konkretny build, nie "latest".
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # VPS na ARM (Oracle Ampere, Hetzner CAX): odkomentuj.
          # platforms: linux/arm64

  deploy:
    # Deploy tylko z zielonego main: wszystkie joby CI muszą przejść.
    needs: [backend, frontend, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ github.sha }}
    secrets: inherit
