services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shoplist
      POSTGRES_PASSWORD: shoplist
      POSTGRES_DB: shoplist
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    ports:
      - "127.0.0.1:5432:5432" # tylko lokalnie, do testów i Alembica z hosta
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shoplist -d shoplist"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://shoplist:shoplist@db:5432/shoplist
      JWT_SECRET: ${JWT_SECRET:?Ustaw JWT_SECRET w pliku .env}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:8081"]'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
